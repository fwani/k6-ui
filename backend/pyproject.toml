[project]
name = "graphio-perf-backend"
version = "0.0.1"
description = "UI 기반 성능 테스트 환경 API"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.13.0",
    "fastapi>=0.109.0",
    "python-dotenv>=1.0.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "sqlalchemy>=2.0.0",
    "httpx>=0.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.1.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
